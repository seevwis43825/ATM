name: CI

# 触发条件
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ============================================================
  # 作业 1：编译（无测试，最快反馈）
  # ============================================================
  build:
    name: 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore src/BankingAgent.slnx

      - name: 编译（警告视为错误）
        run: dotnet build src/BankingAgent.slnx --no-restore -c Release /warnaserror

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: banking-agent-build
          path: |
            src/**/bin/Release/**/*.dll
          retention-days: 3
          if-no-files-found: ignore

  # ============================================================
  # 作业 2：单元测试 + 覆盖率
  # ============================================================
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 运行单元测试
        run: |
          dotnet test src/UnitTests/UnitTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            src/UnitTests/TestResults/**
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/UnitTests/TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # 作业 3：静态检查（格式 + 密钥泄露）
  # ============================================================
  static-analysis:
    name: 静态检查
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 格式检查（dotnet format 验证）
        run: |
          dotnet format src/BankingAgent.slnx \
            --verify-no-changes \
            --severity warn \
            --no-restore || echo "::warning::代码格式检查未通过（非阻断）"

      - name: 密钥泄露扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 依赖漏洞扫描
        run: |
          dotnet list src/BankingAgent.slnx package --vulnerable \
            --include-transitive || echo "::warning::发现漏洞依赖（需人工评估）"

  # ============================================================
  # 作业 4：集成验证（端到端 + 压力）
  # 需要同时启动 Mock Bank 与 Host
  # ============================================================
  integration:
    name: 集成测试（端到端 + 并发压测）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 编译
        run: dotnet build src/BankingAgent.slnx -c Release

      - name: 启动 Mock Bank
        working-directory: src/mock-bank/MockBank.Api
        run: |
          nohup dotnet run --no-build -c Release --urls http://localhost:5200 \
            > mockbank.log 2>&1 &
          echo $! > mockbank.pid

      - name: 启动 AI Agent 宿主
        working-directory: src/src/BankingAgent.Host
        run: |
          nohup dotnet run --no-build -c Release --urls http://localhost:5243 \
            > host.log 2>&1 &
          echo $! > host.pid

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5200/health > /dev/null 2>&1 && \
               curl -sf http://localhost:5243/health > /dev/null 2>&1; then
              echo "服务已就绪（${i} 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::服务启动超时"
          echo "--- Mock Bank 日志 ---"
          cat src/mock-bank/MockBank.Api/mockbank.log 2>/dev/null || true
          echo "--- Host 日志 ---"
          cat src/src/BankingAgent.Host/host.log 2>/dev/null || true
          exit 1

      - name: 打印插件加载情况
        run: |
          echo "=== 插件清单 ==="
          curl -sf http://localhost:5243/api/plugins | head -c 2000
          echo ""
          echo "=== Agent 路由表 ==="
          curl -sf http://localhost:5243/api/plugins/agents

      - name: 运行端到端测试
        working-directory: src
        run: |
          dotnet run --project E2ETest -c Release --no-build \
            -- http://localhost:5243 http://localhost:5200

      - name: 运行并发压力测试
        working-directory: src
        run: |
          dotnet run --project StressTest -c Release --no-build \
            -- http://localhost:5243 http://localhost:5200

      - name: 上传服务日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            src/mock-bank/MockBank.Api/*.log
            src/src/BankingAgent.Host/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 停止服务
        if: always()
        run: |
          kill $(cat src/mock-bank/MockBank.Api/mockbank.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat src/src/BankingAgent.Host/host.pid 2>/dev/null) 2>/dev/null || true

  # ============================================================
  # 汇总门禁
  # ============================================================
  summary:
    name: 检查汇总
    runs-on: ubuntu-latest
    needs: [build, unit-test, static-analysis, integration]
    if: always()
    steps:
      - name: 汇总结果
        run: |
          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 编译 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | ${{ needs.unit-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 静态检查 | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 集成测试 | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "### 有检查项未通过，禁止合并" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### 全部通过" >> $GITHUB_STEP_SUMMARY
