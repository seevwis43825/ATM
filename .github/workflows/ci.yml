name: CI

# 触发条件
# 注意：本仓库的集成分支是 dev（见 docs/03-development/02-git-workflow.md），
# 不是 develop。分支名写错会导致 CI 永不触发。
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ============================================================
  # 作业 1：编译（无测试，最快反馈）
  # ============================================================
  build:
    name: 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 需要两个 SDK：
          #   * 9.0.x —— 编译：.slnx 解决方案格式只被 SDK 9.0.200+ 支持；
          #   * 8.0.x —— 运行：所有项目 TargetFramework 都是 net8.0，
          #     dotnet test / dotnet run / dotnet ef 都要能解析到 .NET 8 运行时。
          #     GitHub 镜像通常已预装（见下方「环境诊断」的输出），
          #     但显式安装更稳妥，不依赖镜像内容。
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 环境诊断（SDK / 运行时）
        run: |
          # 输出到 annotation（无需登录即可在 Actions 摘要看到）。
          # 排查"能编译、一运行就挂"这类问题时，一眼就能确认
          # 实际使用的 SDK 版本与可用运行时列表。
          echo "::notice::SDK=$(dotnet --version) | runtimes=$(dotnet --list-runtimes | tr '\n' ' ')"

      - name: 还原依赖
        run: dotnet restore src/BankingAgent.slnx

      - name: 编译（警告视为错误）
        run: dotnet build src/BankingAgent.slnx --no-restore -c Release /warnaserror

      # ============================================================
      # 数据库迁移一致性门禁（阻断式）
      #
      # 目的：防止有人改了实体模型（或插件的 IEntitySetContributor）
      # 却没生成迁移，导致各环境表结构悄悄分叉。
      #
      # 用 has-pending-model-changes 而不是"生成临时迁移再看有没有文件"：
      # 后者必须把生成的快照编译进程序集才生效，用 --no-build 会误报，
      # 不带 --no-build 又会真的往项目里写文件。
      #
      # 前置条件：必须已经 build 过 —— 命令会以设计时工厂重建模型，
      # 而未构建的插件 DLL / 过期程序集都会让它误判。
      # ============================================================
      - name: 安装 EF Core 工具
        run: dotnet tool restore
        working-directory: src

      - name: 校验迁移与模型一致性
        working-directory: src
        run: |
          # 必须显式指定 --configuration Release。
          # --no-build 会按「配置」定位输出目录，不指定则默认 Debug，
          # 而本作业只构建了 Release —— 结果是
          #   The specified deps.json [.../bin/Debug/net8.0/BankingAgent.Host.deps.json] does not exist
          # 在 CI 上表现为 Process completed with exit code 129，且没有任何编译诊断，
          # 极易被误判为运行时/环境缺失。
          dotnet ef migrations has-pending-model-changes \
            --project src/BankingAgent.Base/BankingAgent.Base.csproj \
            --startup-project src/BankingAgent.Host/BankingAgent.Host.csproj \
            --context BankingDbContext \
            --configuration Release \
            --no-build
          echo "迁移与模型一致"

      # ============================================================
      # 插件契约门禁（阻断式）
      #
      # 校验每个插件是否满足接入契约：入口唯一、命名符合扫描约定、
      # 不引用宿主、不直接引用其他插件、暴露 Agent、分区名结构正确。
      #
      # 为什么必须静态校验：插件是"动态发现 + 反射加载"的，
      # 上面任何一条违规都不会导致编译失败，只表现为
      # 「插件没加载」或运行期行为异常，排查成本很高。
      #
      # 注意传入的是宿主输出目录（同时含 SDK/Base 与 plugins/），
      # 只传 plugins/ 会因为解析不到契约程序集而被明确拒绝。
      # ============================================================
      - name: 校验插件契约
        run: |
          dotnet run --project src/PluginValidator/PluginValidator.csproj \
            --configuration Release --no-build \
            -- src/src/BankingAgent.Host/bin/Release/net8.0/plugins

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: banking-agent-build
          path: |
            src/**/bin/Release/**/*.dll
          retention-days: 3
          if-no-files-found: ignore

  # ============================================================
  # 作业 2：单元测试 + 覆盖率
  # ============================================================
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 同 build 作业：9.0.x 用于编译，8.0.x 提供运行 net8.0 测试宿主所需的运行时
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 运行单元测试
        run: |
          dotnet test src/UnitTests/UnitTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            src/UnitTests/TestResults/**
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/UnitTests/TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # 作业 3：静态检查（格式 + 密钥泄露）
  # ============================================================
  static-analysis:
    name: 静态检查
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 同 build 作业：9.0.x 用于编译，8.0.x 提供运行 net8.0 目标所需的运行时
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 格式检查（dotnet format 验证）
        run: |
          dotnet format src/BankingAgent.slnx \
            --verify-no-changes \
            --severity warn \
            --no-restore || echo "::warning::代码格式检查未通过（非阻断）"

      - name: 密钥泄露扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 依赖漏洞扫描
        run: |
          dotnet list src/BankingAgent.slnx package --vulnerable \
            --include-transitive || echo "::warning::发现漏洞依赖（需人工评估）"

  # ============================================================
  # 作业 4：集成验证（端到端 + 压力）
  # 需要同时启动 Mock Bank 与 Host
  # ============================================================
  integration:
    name: 集成测试（端到端 + 并发压测）
    runs-on: ubuntu-latest
    needs: build
    env:
      # 必须以 Development 运行：
      #   1) 故障注入（X-Mock-Scenario）默认只在 Development 生效 ——
      #      压测的"故障注入返回 503"断言依赖它；
      #   2) 缺失密钥时 Development 会走派生密钥兜底，CI 无需注入真实密钥。
      # 这也顺带验证了"非开发环境默认关闭故障注入"这条安全边界没有被误开。
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 本作业最依赖 8.0.x：MockBank / 宿主 / E2E / 压测都是 net8.0 程序，
          # 只有 SDK 9 的镜像里没有 .NET 8 运行时，会全部启动失败
          dotnet-version: |
            8.0.x
            9.0.x

      - name: 编译
        run: dotnet build src/BankingAgent.slnx -c Release

      - name: 启动 Mock Bank
        working-directory: src/mock-bank/MockBank.Api
        run: |
          nohup dotnet run --no-build -c Release --urls http://localhost:5200 \
            > mockbank.log 2>&1 &
          echo $! > mockbank.pid

      - name: 启动 AI Agent 宿主
        working-directory: src/src/BankingAgent.Host
        run: |
          nohup dotnet run --no-build -c Release --urls http://localhost:5243 \
            > host.log 2>&1 &
          echo $! > host.pid

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5200/health > /dev/null 2>&1 && \
               curl -sf http://localhost:5243/health > /dev/null 2>&1; then
              echo "服务已就绪（${i} 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::服务启动超时"
          echo "--- Mock Bank 日志 ---"
          cat src/mock-bank/MockBank.Api/mockbank.log 2>/dev/null || true
          echo "--- Host 日志 ---"
          cat src/src/BankingAgent.Host/host.log 2>/dev/null || true
          exit 1

      - name: 打印插件加载情况
        run: |
          # 注意：/api/plugins 与 /api/plugins/agents 都在认证中间件之后
          # （公开白名单只有 /health 与 /api/auth/token），无令牌访问返回 401。
          # 原先直接 `curl -sf` 会因 -f 把 401 变成非零退出码，导致本作业在
          # 「诊断步骤」上就失败，E2E 与压测根本没机会运行，真正的原因反被掩盖。
          # 因此这里先取令牌，并且**任何失败都不阻断作业**（诊断步骤不应拥有门禁权力）。
          TOKEN=$(curl -s -X POST http://localhost:5243/api/auth/token \
            -H "Content-Type: application/json" \
            -d '{"userId":"admin_01","password":"admin1234"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

          if [ -z "$TOKEN" ]; then
            echo "::warning::未取得访问令牌，跳过插件清单打印（不影响门禁）"
            exit 0
          fi

          echo "=== 插件清单 ==="
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:5243/api/plugins | head -c 2000
          echo ""
          echo "=== Agent 路由表 ==="
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:5243/api/plugins/agents

      - name: 运行端到端测试
        working-directory: src
        run: |
          dotnet run --project E2ETest -c Release --no-build \
            -- http://localhost:5243 http://localhost:5200

      - name: 运行并发压力测试
        working-directory: src
        run: |
          dotnet run --project StressTest -c Release --no-build \
            -- http://localhost:5243 http://localhost:5200

      - name: 上传服务日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            src/mock-bank/MockBank.Api/*.log
            src/src/BankingAgent.Host/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 停止服务
        if: always()
        run: |
          kill $(cat src/mock-bank/MockBank.Api/mockbank.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat src/src/BankingAgent.Host/host.pid 2>/dev/null) 2>/dev/null || true

  # ============================================================
  # 汇总门禁
  # ============================================================
  summary:
    name: 检查汇总
    runs-on: ubuntu-latest
    needs: [build, unit-test, static-analysis, integration]
    if: always()
    steps:
      - name: 汇总结果
        run: |
          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 编译 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | ${{ needs.unit-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 静态检查 | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 集成测试 | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "### 有检查项未通过，禁止合并" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### 全部通过" >> $GITHUB_STEP_SUMMARY
