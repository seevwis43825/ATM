<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Banking Agent · 插件化多 Agent 控制台</title>
<style>
  :root {
    --primary: #4F46E5;
    --primary-600: #4338CA;
    --primary-50: #EEF2FF;
    --ink-900: #0F172A;
    --ink-700: #334155;
    --ink-500: #64748B;
    --ink-300: #CBD5E1;
    --ink-100: #F1F5F9;
    --success: #10B981;
    --warning: #F59E0B;
    --danger: #EF4444;
    --canvas: #F8FAFC;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--canvas);
    color: var(--ink-900);
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--ink-300);
  }
  .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 8px; background: var(--primary);
    color: #fff; display: grid; place-items: center; font-size: 13px;
  }
  .brand small { font-weight: 400; color: var(--ink-500); font-size: 12px; }
  header .spacer { flex: 1; }
  .login { display: flex; align-items: center; gap: 8px; }
  select, input, button { font: inherit; }
  select, input {
    padding: 7px 10px; border: 1px solid var(--ink-300); border-radius: 8px; background: #fff; color: var(--ink-900);
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  button {
    padding: 8px 14px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--primary-600); }
  button:disabled { background: var(--ink-300); cursor: not-allowed; }
  button.ghost { background: var(--ink-100); color: var(--ink-700); }
  button.ghost:hover { background: var(--ink-300); }
  button.danger { background: var(--danger); }
  .pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; background: var(--ink-100); color: var(--ink-700); }
  .pill.ok { background: #DCFCE7; color: #166534; }
  .pill.bad { background: #FEE2E2; color: #991B1B; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px; min-height: 0; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }

  .panel { background: #fff; border: 1px solid var(--ink-300); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
  .panel-head { padding: 10px 14px; border-bottom: 1px solid var(--ink-100); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 14px; }
  .panel-body { padding: 12px 14px; overflow: auto; flex: 1; min-height: 0; }

  #stream { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: var(--ink-500); }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--primary); }
  .bubble { max-width: 78%; }
  .bubble .text { background: var(--ink-100); border-radius: var(--radius); padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble .text { background: var(--primary); color: #fff; }
  .meta { margin: 4px 2px 0; font-size: 12px; color: var(--ink-500); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta code { background: var(--ink-100); padding: 1px 6px; border-radius: 6px; color: var(--ink-700); }
  .card { margin-top: 8px; border: 1px solid var(--ink-300); border-radius: var(--radius); background: #fff; overflow: hidden; }
  .card .card-head { padding: 8px 12px; background: var(--primary-50); font-weight: 600; font-size: 13px; color: var(--primary-600); }
  .card .card-body { padding: 10px 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--ink-100); }
  th { color: var(--ink-500); font-weight: 500; }
  td.num, th.num { text-align: right; }
  .bar { height: 6px; background: var(--ink-100); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--primary); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .error { color: #991B1B; background: #FEE2E2; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
  .warn { color: #92400E; background: #FEF3C7; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }

  .composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--ink-100); }
  .composer input { flex: 1; }
  .quick { padding: 0 14px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .quick button { background: var(--ink-100); color: var(--ink-700); font-size: 12px; padding: 6px 10px; }
  .quick button:hover { background: var(--ink-300); }

  .tabs { display: flex; gap: 4px; padding: 8px 10px 0; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--ink-500); padding: 6px 10px; border-radius: 8px; }
  .tabs button.active { background: var(--primary-50); color: var(--primary-600); font-weight: 600; }
  .plugin { border: 1px solid var(--ink-100); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .plugin h3 { margin: 0 0 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .plugin p { margin: 4px 0; color: var(--ink-500); font-size: 12px; }
  .plugin .kv { font-size: 12px; color: var(--ink-700); }
  .tag { display: inline-block; background: var(--ink-100); border-radius: 6px; padding: 1px 6px; margin: 2px 4px 2px 0; font-size: 11px; color: var(--ink-700); }
  .steps .step { border-left: 3px solid var(--primary); padding: 6px 0 6px 10px; margin: 6px 0; }
  .muted { color: var(--ink-500); font-size: 12px; }
  .empty { color: var(--ink-500); text-align: center; padding: 24px 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">AI</span>
    <span>AI Banking Agent <small>插件化多 Agent 控制台</small></span>
  </div>
  <div class="spacer"></div>
  <div class="login">
    <select id="account">
      <option value="u_demo01">u_demo01 · 张明（用户）</option>
      <option value="u_demo02">u_demo02 · 李华（用户）</option>
      <option value="u_demo03">u_demo03 · 王芳（用户）</option>
      <option value="staff_01">staff_01 · 客服（可代客）</option>
      <option value="audit_01">audit_01 · 审计员</option>
      <option value="admin_01">admin_01 · 管理员</option>
    </select>
    <input id="password" type="password" value="demo1234" style="width:120px" placeholder="密码" />
    <button id="login">登录</button>
    <span id="status" class="pill">未登录</span>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>对话</h2>
      <label class="muted">模式
        <select id="mode">
          <option value="chat">单跳路由 /api/chat</option>
          <option value="orchestrate">多 Agent 编排 /api/orchestrate</option>
        </select>
      </label>
      <span class="muted">会话 <code id="sessionId">-</code></span>
      <div class="spacer" style="flex:1"></div>
      <button id="newSession" class="ghost">新会话</button>
      <button id="clear" class="ghost">清空</button>
    </div>
    <div id="stream">
      <div class="empty">请先登录，然后发一句话试试。例如「给李华转 500 元，备注房租」</div>
    </div>
    <div class="quick">
      <button data-say="我有哪些卡">我有哪些卡</button>
      <button data-say="我上个月花了多少">本月账单</button>
      <button data-say="有什么理财产品">理财产品</button>
      <button data-say="我的余额">余额</button>
      <button data-say="给李华转 500 元，备注房租">转账 500（直接执行）</button>
      <button data-say="给王芳转 30000 元">转账 30000（触发人工确认）</button>
      <button data-say="资产总览">资产总览（多 Agent 并行）</button>
    </div>
    <div class="composer">
      <input id="input" placeholder="用自然语言描述你要办的业务…" />
      <button id="send">发送</button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs">
      <button data-tab="plugins" class="active">插件</button>
      <button data-tab="agents">Agent 路由表</button>
      <button data-tab="compliance">合规规则</button>
      <button data-tab="events">事件总线</button>
    </div>
    <div class="panel-body" id="sideBody">
      <div class="empty">登录后自动加载</div>
    </div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
